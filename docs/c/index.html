<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uporedi putovanja · Atlas putovanja</title>
<meta name="theme-color" content="#0A1430">
<meta name="robots" content="noindex">
<meta property="og:title" content="Uporedi putovanja sa mnom · Atlas putovanja">
<meta property="og:description" content="Otvori link u aplikaciji Atlas putovanja i vidi gde smo bili oboje.">
<meta property="og:image" content="https://srdjan89np.github.io/atlas-putovanja/img/og.jpg">
<link rel="icon" href="../img/icon-192.png">
<style>
:root{--ink:#F3F6FB;--muted:#A9B6CF;--pop:#7FEAF5;--pop-ink:#03252E}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 16px;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(120% 80% at 50% 25%,#1B2E5C 0%,#0A1430 55%,#03060F 100%)}
main{width:min(440px,100%);text-align:center}
img.icon{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 30px rgb(0 0 0 / .4)}
h1{font-size:28px;line-height:1.15;margin:20px 0 8px;letter-spacing:-.02em}
p{color:var(--muted);line-height:1.5;margin:0 0 22px}
a.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;font-weight:800;text-decoration:none;margin:10px 0}
a.primary{background:var(--pop);color:var(--pop-ink)}
a.ghost{border:1px solid rgb(255 255 255 / .35);color:var(--ink)}
code{display:block;word-break:break-all;background:rgb(255 255 255 / .08);border-radius:12px;padding:12px;font-size:12px;color:var(--muted);margin-top:18px}
small{display:block;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<main>
  <img class="icon" src="../img/icon-192.png" alt="">
  <h1 id="h" data-sr="Prijatelj te poziva da uporedite putovanja" data-en="A friend wants to compare travels with you">Prijatelj te poziva da uporedite putovanja</h1>
  <p id="p" data-sr="Otvori link u aplikaciji Atlas putovanja i vidi gde ste bili oboje, a gde samo jedno od vas." data-en="Open the link in the Travel Atlas app and see where you've both been — and where only one of you has.">Otvori link u aplikaciji Atlas putovanja i vidi gde ste bili oboje, a gde samo jedno od vas.</p>
  <a class="btn primary" id="open" href="#" data-sr="Otvori u aplikaciji" data-en="Open in the app">Otvori u aplikaciji</a>
  <a class="btn ghost" id="play" href="https://play.google.com/store/apps/details?id=rs.atlasputovanja.app" data-sr="Preuzmi sa Google Play" data-en="Get it on Google Play">Preuzmi sa Google Play</a>
  <small data-sr="Nemaš aplikaciju? Instaliraj je, pa ponovo otvori ovaj link." data-en="Don't have the app? Install it, then open this link again.">Nemaš aplikaciju? Instaliraj je, pa ponovo otvori ovaj link.</small>
  <code id="code" hidden></code>
</main>
<script>
(function(){
  var en = !/^sr|^hr|^bs|^sh/i.test(navigator.language || "");
  if(en){ document.documentElement.lang = "en"; document.querySelectorAll("[data-en]").forEach(function(e){ e.textContent = e.getAttribute("data-en"); }); document.title = "Compare travels · Travel Atlas"; }
  var m = decodeURIComponent(location.hash || "").match(/AP1\.[A-Za-z0-9_.-]+/);
  var code = m ? m[0] : "";
  var name = "";
  try{ var parts = code.split("."); if(parts[2]){ var b = parts[2].replace(/-/g,"+").replace(/_/g,"/"); while(b.length % 4) b += "="; name = decodeURIComponent(escape(atob(b))); } }catch(e){}
  if(name){ var h = document.getElementById("h"); h.textContent = en ? name + " wants to compare travels with you" : name + " te poziva da uporedite putovanja"; }
  var play = "https://play.google.com/store/apps/details?id=rs.atlasputovanja.app";
  var android = /Android/i.test(navigator.userAgent);
  var open = document.getElementById("open");
  if(code){
    var c = document.getElementById("code"); c.textContent = code; c.hidden = android;
    open.href = android ? "intent://c/" + code + "#Intent;scheme=atlasputovanja;package=rs.atlasputovanja.app;S.browser_fallback_url=" + encodeURIComponent(play) + ";end" : "atlasputovanja://c/" + code;
    if(android) setTimeout(function(){ location.href = open.href; }, 300);
  } else { open.href = play; }
})();
</script>
</body>
</html>
